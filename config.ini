[AUDIO]
sample_rate = 16000
channels = 1
chunk_size = 1024
chunk_duration = 60
silence_seconds = 1.5
silence_threshold = 300
max_duration = 0

[CONTROL]
key_record_toggle = f8
key_quick_send = f9
key_force_stop_tts = f10
key_play_last_original = f6

[STT]
model_size = large-v3
device = cuda
compute_type = float16
language = zh
beam_size = 5
vad_filter = true
# initial_prompt 引導輸出繁體並提示常用詞；留空則不使用。
initial_prompt = 以下是繁體中文的句子。

[SLM]
enabled = false
model = gemma3:1b
base_url = http://localhost:11434/v1
api_key =
summary_threshold = 20
retry = 0

[LLM]
model = qwen/qwen3.5-9b
base_url = http://localhost:1234/v1
api_key =
retry = 0

# -- Gemini API (備份) --
# model = gemini-2.5-flash-lite
# base_url = https://generativelanguage.googleapis.com/v1beta/openai/
# api_key =

[SERVER]
enabled = false
url = http://localhost:8000/chat
timeout = 30
retry = 0

[TTS]
engine = kokoro
rate = 180
volume = 1.0
kokoro_model_dir = models/kokoro
kokoro_voice_en = af_heart
kokoro_voice_zh = zf_001
kokoro_speed = 1.0

[SESSION]
auto_save = true
backup_interval = 300

[WORKSPACE]
output_dir = output
failed_dir = output/failed
sessions_file = output/.sessions.json
permissions_file = output/.permissions.json
log_file = output/system.log

[UI]
status_refresh_rate = 0.1

[LOGGING]
level = INFO

[MOBILE]
host = 0.0.0.0
port = 8080
ssl = true
ssl_cert = output/ssl/cert.pem
ssl_key = output/ssl/key.pem
