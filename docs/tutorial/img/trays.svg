<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="三個工作區托盤"><title>三個工作區托盤</title><style>
.pn{fill:#FFFFFF;stroke:#D5DDD6}.cd{fill:#F2F5F1;stroke:#C9D3CB}.ink{fill:#1E2930}.mu{fill:#5B6B70}
.am{fill:#D9731A}.amS{stroke:#D9731A}.te{fill:#2B7A6A}.teS{stroke:#2B7A6A}.ln{stroke:#9AA8A4}.wh{fill:#FFFFFF}
text{font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.t1{font-size:19px;font-weight:700}.t2{font-size:14px}.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
@media (prefers-color-scheme:dark){.pn{fill:#1B2327;stroke:#2C383C}.cd{fill:#12181B;stroke:#33424A}.ink{fill:#E5ECE7}
.mu{fill:#9AABA8}.am{fill:#F0954A}.amS{stroke:#F0954A}.te{fill:#5BBFA6}.teS{stroke:#5BBFA6}.ln{stroke:#5E6E6C}.wh{fill:#12181B}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mu"/></marker></defs><rect class="pn" x="1" y="1" width="718" height="388" rx="18"/><text x="360" y="40" class="t1 ink" text-anchor="middle">三個托盤：說出來的字只會掉進「現在這一個」</text><rect x="40" y="120" width="190" height="130" rx="16" class="cd"/><path d="M58 168h154l-12 60h-130z" class="am" opacity=".9"/><rect x="80" y="150" width="70" height="12" rx="3" class="pn"/><rect x="100" y="138" width="80" height="12" rx="3" class="pn"/><text x="135" y="278" class="t1 ink" text-anchor="middle">寄件匣</text><text x="135" y="300" class="mono te" text-anchor="middle">buffer</text><text x="135" y="322" class="t2 mu" text-anchor="middle">只有它能寄給 AI</text><rect x="85" y="72" width="100" height="30" rx="15" class="am"/><text x="135" y="93" class="t2 wh" text-anchor="middle">現在這個</text><rect x="265" y="120" width="190" height="130" rx="16" class="cd"/><path d="M283 168h154l-12 60h-130z" class="te" opacity=".9"/><rect x="305" y="150" width="70" height="12" rx="3" class="pn"/><rect x="325" y="138" width="80" height="12" rx="3" class="pn"/><text x="360" y="278" class="t1 ink" text-anchor="middle">草稿匣</text><text x="360" y="300" class="mono te" text-anchor="middle">stt</text><text x="360" y="322" class="t2 mu" text-anchor="middle">想先存著就放這</text><rect x="490" y="120" width="190" height="130" rx="16" class="cd"/><path d="M508 168h154l-12 60h-130z" class="mu" opacity=".9"/><rect x="530" y="150" width="70" height="12" rx="3" class="pn"/><rect x="550" y="138" width="80" height="12" rx="3" class="pn"/><text x="585" y="278" class="t1 ink" text-anchor="middle">對話紀錄</text><text x="585" y="300" class="mono te" text-anchor="middle">chat</text><text x="585" y="322" class="t2 mu" text-anchor="middle">只能看、不能改</text><text x="360" y="362" class="mono ink" text-anchor="middle">切換：/ws stt　切回：/ws buffer　看全部：/ws</text></svg>
