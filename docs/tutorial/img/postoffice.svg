<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" role="img" aria-label="資料隧道郵局比喻"><title>資料隧道郵局比喻</title><style>
.pn{fill:#FFFFFF;stroke:#D5DDD6}.cd{fill:#F2F5F1;stroke:#C9D3CB}.ink{fill:#1E2930}.mu{fill:#5B6B70}
.am{fill:#D9731A}.amS{stroke:#D9731A}.te{fill:#2B7A6A}.teS{stroke:#2B7A6A}.ln{stroke:#9AA8A4}.wh{fill:#FFFFFF}
text{font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.t1{font-size:19px;font-weight:700}.t2{font-size:14px}.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
@media (prefers-color-scheme:dark){.pn{fill:#1B2327;stroke:#2C383C}.cd{fill:#12181B;stroke:#33424A}.ink{fill:#E5ECE7}
.mu{fill:#9AABA8}.am{fill:#F0954A}.amS{stroke:#F0954A}.te{fill:#5BBFA6}.teS{stroke:#5BBFA6}.ln{stroke:#5E6E6C}.wh{fill:#12181B}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mu"/></marker></defs><rect class="pn" x="1" y="1" width="718" height="433" rx="18"/><text x="360" y="40" class="t1 ink" text-anchor="middle">程式內部像一間郵局：每個房間只寫信、收信，郵差一次送一封</text><rect x="40" y="80" width="140" height="80" rx="12" class="cd"/><text x="110" y="116" class="t1 ink" text-anchor="middle">錄音室</text><text x="110" y="140" class="mono te" text-anchor="middle">寄 audio</text><rect x="40" y="190" width="140" height="80" rx="12" class="cd"/><text x="110" y="226" class="t1 ink" text-anchor="middle">分流閘門</text><text x="110" y="250" class="mono te" text-anchor="middle">寄 raw_text</text><rect x="40" y="300" width="140" height="80" rx="12" class="cd"/><text x="110" y="336" class="t1 ink" text-anchor="middle">鍵盤室</text><text x="110" y="360" class="mono te" text-anchor="middle">寄 commands</text><rect x="540" y="80" width="140" height="80" rx="12" class="cd"/><text x="610" y="116" class="t1 ink" text-anchor="middle">聽寫室</text><text x="610" y="140" class="mono te" text-anchor="middle">收 audio</text><rect x="540" y="190" width="140" height="80" rx="12" class="cd"/><text x="610" y="226" class="t1 ink" text-anchor="middle">托盤管理員</text><text x="610" y="250" class="mono te" text-anchor="middle">收 raw_text</text><rect x="540" y="300" width="140" height="80" rx="12" class="cd"/><text x="610" y="336" class="t1 ink" text-anchor="middle">指令總管</text><text x="610" y="360" class="mono te" text-anchor="middle">收 commands</text><rect x="280" y="140" width="160" height="180" rx="18" class="te"/><path d="M300 140l60 -36l60 36z" class="te"/><text x="360" y="214" class="t1 wh" text-anchor="middle">Exchange</text><text x="360" y="240" class="t1 wh" text-anchor="middle">郵局</text><text x="360" y="270" class="t2 wh" text-anchor="middle">照信封上的</text><text x="360" y="290" class="t2 wh" text-anchor="middle">topic 分信</text><line x1="182" y1="120" x2="276" y2="180" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="182" y1="230" x2="276" y2="230" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="182" y1="340" x2="276" y2="280" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="444" y1="180" x2="536" y2="120" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="444" y1="230" x2="536" y2="230" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="444" y1="280" x2="536" y2="340" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><text x="360" y="412" class="t2 mu" text-anchor="middle">信封＝Message（topic + payload）；寄件匣＝Outbox；收件匣＝Inbox</text></svg>
