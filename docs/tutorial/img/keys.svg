<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="五個熱鍵"><title>五個熱鍵</title><style>
.pn{fill:#FFFFFF;stroke:#D5DDD6}.cd{fill:#F2F5F1;stroke:#C9D3CB}.ink{fill:#1E2930}.mu{fill:#5B6B70}
.am{fill:#D9731A}.amS{stroke:#D9731A}.te{fill:#2B7A6A}.teS{stroke:#2B7A6A}.ln{stroke:#9AA8A4}.wh{fill:#FFFFFF}
text{font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.t1{font-size:19px;font-weight:700}.t2{font-size:14px}.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
@media (prefers-color-scheme:dark){.pn{fill:#1B2327;stroke:#2C383C}.cd{fill:#12181B;stroke:#33424A}.ink{fill:#E5ECE7}
.mu{fill:#9AABA8}.am{fill:#F0954A}.amS{stroke:#F0954A}.te{fill:#5BBFA6}.teS{stroke:#5BBFA6}.ln{stroke:#5E6E6C}.wh{fill:#12181B}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mu"/></marker></defs><rect class="pn" x="1" y="1" width="718" height="288" rx="18"/><text x="360" y="40" class="t1 ink" text-anchor="middle">五顆魔法鍵（KDE Wayland 用 Alt+F8／Alt+F9）</text><rect x="24" y="70" width="120" height="96" rx="14" class="cd"/><rect x="24" y="158" width="120" height="10" rx="5" class="cd" opacity=".5"/><text x="84" y="132" style="font-size:34px" class="t1 ink" text-anchor="middle">F6</text><text x="84" y="200" class="t1 ink" text-anchor="middle">再唸一次</text><text x="84" y="224" class="t2 mu" text-anchor="middle">AI 的原文</text><rect x="160" y="70" width="120" height="96" rx="14" class="cd"/><rect x="160" y="158" width="120" height="10" rx="5" class="cd" opacity=".5"/><text x="220" y="132" style="font-size:34px" class="t1 ink" text-anchor="middle">F7</text><text x="220" y="200" class="t1 ink" text-anchor="middle">用嘴下指令</text><text x="220" y="224" class="t2 mu" text-anchor="middle">說「發送」</text><rect x="296" y="70" width="120" height="96" rx="14" class="am"/><rect x="296" y="158" width="120" height="10" rx="5" class="am" opacity=".5"/><text x="356" y="132" style="font-size:34px" class="t1 wh" text-anchor="middle">F8</text><text x="356" y="200" class="t1 ink" text-anchor="middle">錄音開關</text><text x="356" y="224" class="t2 mu" text-anchor="middle">按一下聽、再按停</text><rect x="432" y="70" width="120" height="96" rx="14" class="cd"/><rect x="432" y="158" width="120" height="10" rx="5" class="cd" opacity=".5"/><text x="492" y="132" style="font-size:34px" class="t1 ink" text-anchor="middle">F9</text><text x="492" y="200" class="t1 ink" text-anchor="middle">馬上寄出</text><text x="492" y="224" class="t2 mu" text-anchor="middle">buffer → AI</text><rect x="568" y="70" width="120" height="96" rx="14" class="cd"/><rect x="568" y="158" width="120" height="10" rx="5" class="cd" opacity=".5"/><text x="628" y="132" style="font-size:34px" class="t1 ink" text-anchor="middle">F10</text><text x="628" y="200" class="t1 ink" text-anchor="middle">閉嘴！</text><text x="628" y="224" class="t2 mu" text-anchor="middle">停止朗讀</text><text x="360" y="262" class="t2 mu" text-anchor="middle">最常用的是 F8：按一下開始聽，再按一下就停下來把話寫成字。</text></svg>
