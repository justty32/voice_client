<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="一句話的旅程"><title>一句話的旅程</title><style>
.pn{fill:#FFFFFF;stroke:#D5DDD6}.cd{fill:#F2F5F1;stroke:#C9D3CB}.ink{fill:#1E2930}.mu{fill:#5B6B70}
.am{fill:#D9731A}.amS{stroke:#D9731A}.te{fill:#2B7A6A}.teS{stroke:#2B7A6A}.ln{stroke:#9AA8A4}.wh{fill:#FFFFFF}
text{font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.t1{font-size:19px;font-weight:700}.t2{font-size:14px}.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
@media (prefers-color-scheme:dark){.pn{fill:#1B2327;stroke:#2C383C}.cd{fill:#12181B;stroke:#33424A}.ink{fill:#E5ECE7}
.mu{fill:#9AABA8}.am{fill:#F0954A}.amS{stroke:#F0954A}.te{fill:#5BBFA6}.teS{stroke:#5BBFA6}.ln{stroke:#5E6E6C}.wh{fill:#12181B}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mu"/></marker></defs><rect class="pn" x="1" y="1" width="718" height="418" rx="18"/><rect x="30" y="60" width="200" height="150" rx="14" class="cd"/><rect x="121.0" y="80" width="18" height="30" rx="9" class="am"/><path d="M115.0 100a15 15 0 0 0 30 0M130.0 115v9M121.0 124h18" fill="none" class="amS" stroke-width="3" stroke-linecap="round"/><text x="130.0" y="152" class="t1 ink" text-anchor="middle">① 耳朵</text><text x="130.0" y="174" class="t2 mu" text-anchor="middle">按 F8 開始聽</text><text x="130.0" y="194" class="mono te" text-anchor="middle">speech/record</text><rect x="260" y="60" width="200" height="150" rx="14" class="cd"/><rect x="344.0" y="82" width="32" height="40" rx="4" class="cd"/><path d="M351.0 93h18M351.0 101h18M351.0 109h11" class="teS" stroke-width="3" stroke-linecap="round"/><text x="360.0" y="152" class="t1 ink" text-anchor="middle">② 速記員</text><text x="360.0" y="174" class="t2 mu" text-anchor="middle">把聲音寫成字</text><text x="360.0" y="194" class="mono te" text-anchor="middle">speech/voice_to_text</text><rect x="490" y="60" width="200" height="150" rx="14" class="cd"/><path d="M566.0 98l8 -14h32l8 14v14h-48z" class="te"/><path d="M566.0 98h14l4 6h12l4 -6h14" fill="none" stroke="#fff" stroke-width="2.5"/><text x="590.0" y="152" class="t1 ink" text-anchor="middle">③ 托盤</text><text x="590.0" y="174" class="t2 mu" text-anchor="middle">字先放這裡</text><text x="590.0" y="194" class="mono te" text-anchor="middle">domain/workspace</text><rect x="490" y="250" width="200" height="150" rx="14" class="cd"/><rect x="566.0" y="276" width="48" height="32" rx="5" class="am"/><path d="M568.0 279l22 16l22 -16" fill="none" stroke="#fff" stroke-width="2.5"/><text x="590.0" y="342" class="t1 ink" text-anchor="middle">④ 寄出</text><text x="590.0" y="364" class="t2 mu" text-anchor="middle">F9 或 /send</text><text x="590.0" y="384" class="mono te" text-anchor="middle">llm/http_client</text><rect x="260" y="250" width="200" height="150" rx="14" class="cd"/><circle cx="360.0" cy="292" r="22" class="te"/><path d="M350.0 286q10 -10 20 0M348.0 297q12 10 24 0M360.0 278v28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="360.0" y="342" class="t1 ink" text-anchor="middle">⑤ AI 回信</text><text x="360.0" y="364" class="t2 mu" text-anchor="middle">太長就先摘要</text><text x="360.0" y="384" class="mono te" text-anchor="middle">modules/chat_flow</text><rect x="30" y="250" width="200" height="150" rx="14" class="cd"/><path d="M110.0 284h10l12 -11v38l-12 -11h-10z" class="am"/><path d="M138.0 284q6 8 0 16M144.0 278q12 14 0 28" fill="none" class="amS" stroke-width="3" stroke-linecap="round"/><text x="130.0" y="342" class="t1 ink" text-anchor="middle">⑥ 嘴巴</text><text x="130.0" y="364" class="t2 mu" text-anchor="middle">唸給你聽</text><text x="130.0" y="384" class="mono te" text-anchor="middle">speech/text_to_voice</text><line x1="232" y1="135" x2="256" y2="135" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="462" y1="135" x2="486" y2="135" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="590" y1="212" x2="590" y2="246" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="488" y1="325" x2="464" y2="325" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="258" y1="325" x2="234" y2="325" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><text x="360" y="38" class="t1 ink" text-anchor="middle">一句話的旅程：你說 → 它聽 → 它寫 → 它寄 → AI 回 → 它唸</text></svg>
