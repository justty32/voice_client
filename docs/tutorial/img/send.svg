<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="送出與朗讀流程"><title>送出與朗讀流程</title><style>
.pn{fill:#FFFFFF;stroke:#D5DDD6}.cd{fill:#F2F5F1;stroke:#C9D3CB}.ink{fill:#1E2930}.mu{fill:#5B6B70}
.am{fill:#D9731A}.amS{stroke:#D9731A}.te{fill:#2B7A6A}.teS{stroke:#2B7A6A}.ln{stroke:#9AA8A4}.wh{fill:#FFFFFF}
text{font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.t1{font-size:19px;font-weight:700}.t2{font-size:14px}.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
@media (prefers-color-scheme:dark){.pn{fill:#1B2327;stroke:#2C383C}.cd{fill:#12181B;stroke:#33424A}.ink{fill:#E5ECE7}
.mu{fill:#9AABA8}.am{fill:#F0954A}.amS{stroke:#F0954A}.te{fill:#5BBFA6}.teS{stroke:#5BBFA6}.ln{stroke:#5E6E6C}.wh{fill:#12181B}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mu"/></marker></defs><rect class="pn" x="1" y="1" width="718" height="438" rx="18"/><text x="360" y="40" class="t1 ink" text-anchor="middle">寄出之後：AI 回信，太長就先請小助手摘要再唸</text><rect x="24" y="70" width="150" height="150" rx="14" class="cd"/><path d="M75.0 108l8 -14h32l8 14v14h-48z" class="te"/><path d="M75.0 108h14l4 6h12l4 -6h14" fill="none" stroke="#fff" stroke-width="2.5"/><text x="99.0" y="162" class="t1 ink" text-anchor="middle">buffer</text><text x="99.0" y="184" class="t2 mu" text-anchor="middle">/send 或 F9</text><rect x="208" y="70" width="150" height="150" rx="14" class="cd"/><circle cx="283.0" cy="112" r="22" class="te"/><path d="M273.0 106q10 -10 20 0M271.0 117q12 10 24 0M283.0 98v28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="283.0" y="162" class="t1 ink" text-anchor="middle">大 AI</text><text x="283.0" y="184" class="t2 mu" text-anchor="middle">[LLM] 回信</text><path d="M433 70l58 75l-58 75l-58 -75z" class="cd"/><text x="433" y="140" class="t2 ink" text-anchor="middle">超過</text><text x="433" y="160" class="t2 ink" text-anchor="middle">20 字？</text><rect x="546" y="70" width="150" height="150" rx="14" class="cd"/><path d="M601.0 104h10l12 -11v38l-12 -11h-10z" class="am"/><path d="M629.0 104q6 8 0 16M635.0 98q12 14 0 28" fill="none" class="amS" stroke-width="3" stroke-linecap="round"/><text x="621.0" y="162" class="t1 ink" text-anchor="middle">唸原文</text><text x="621.0" y="184" class="t2 mu" text-anchor="middle">短回覆直接唸</text><rect x="370" y="270" width="150" height="150" rx="14" class="cd"/><circle cx="445.0" cy="312" r="22" class="te"/><path d="M435.0 306q10 -10 20 0M433.0 317q12 10 24 0M445.0 298v28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="445.0" y="362" class="t1 ink" text-anchor="middle">小助手</text><text x="445.0" y="384" class="t2 mu" text-anchor="middle">[SLM] 寫摘要</text><rect x="546" y="270" width="150" height="150" rx="14" class="cd"/><path d="M601.0 304h10l12 -11v38l-12 -11h-10z" class="am"/><path d="M629.0 304q6 8 0 16M635.0 298q12 14 0 28" fill="none" class="amS" stroke-width="3" stroke-linecap="round"/><text x="621.0" y="362" class="t1 ink" text-anchor="middle">唸摘要</text><text x="621.0" y="384" class="t2 mu" text-anchor="middle">F6 可聽原文</text><line x1="176" y1="145" x2="204" y2="145" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="360" y1="145" x2="372" y2="145" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><line x1="493" y1="145" x2="542" y2="145" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><text x="518" y="136" class="t2 mu" text-anchor="middle">否</text><line x1="433" y1="222" x2="440" y2="266" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><text x="452" y="248" class="t2 mu" text-anchor="start">是（且 SLM 開著）</text><line x1="522" y1="345" x2="542" y2="345" class="ln" stroke-width="2.5" marker-end="url(#ar)"/><text x="190" y="330" class="t2 mu" text-anchor="middle">小助手失敗也不會沉默：</text><text x="190" y="352" class="t2 mu" text-anchor="middle">畫面提示並改唸原文</text></svg>
