<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mu"/></marker></defs><rect class="pn" x="1" y="1" width="718" height="423" rx="18"/><text x="360" y="40" class="t1 ink" text-anchor="middle">手機模式：電腦當大腦，手機當麥克風和螢幕</text><rect x="70" y="80" width="130" height="230" rx="20" class="ink"/><rect x="80" y="98" width="110" height="190" rx="8" class="cd"/><rect x="126" y="168" width="18" height="30" rx="9" class="am"/><path d="M120 188a15 15 0 0 0 30 0M135 203v9M126 212h18" fill="none" class="amS" stroke-width="3" stroke-linecap="round"/><text x="135" y="340" class="t1 ink" text-anchor="middle">手機瀏覽器</text><text x="135" y="362" class="mono te" text-anchor="middle">https://電腦IP:8080</text><rect x="470" y="100" width="200" height="140" rx="10" class="ink"/><rect x="482" y="112" width="176" height="108" rx="4" class="cd"/><rect x="440" y="244" width="260" height="16" rx="8" class="ink"/><circle cx="570" cy="166" r="22" class="te"/><path d="M560 160q10 -10 20 0M558 171q12 10 24 0M570 152v28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="570" y="300" class="t1 ink" text-anchor="middle">電腦跑 mobile_server.py</text><text x="570" y="322" class="t2 mu" text-anchor="middle">辨識、AI、指令都在這</text><line x1="215" y1="170" x2="455" y2="170" class="teS" stroke-width="2.5" marker-end="url(#ar)"/><text x="335" y="160" class="t2 te" text-anchor="middle">錄音上傳</text><line x1="455" y1="210" x2="215" y2="210" class="amS" stroke-width="2.5" marker-end="url(#ar)"/><text x="335" y="236" class="t2 am" text-anchor="middle">文字、回覆、朗讀</text><text x="335" y="120" class="t2 mu" text-anchor="middle">同一個 WiFi</text><text x="360" y="400" class="t2 mu" text-anchor="middle">只服務最新的一條連線：重新整理就會取代舊頁面</text></svg>
